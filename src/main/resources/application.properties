spring.application.name=ms-auth
server.port=8081

# Conexión a MySQL (la base de datos se crea automáticamente si no existe)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT (la misma clave debe estar configurada en el api-gateway)
jwt.secret=${JWT_SECRET:618ZmZ1dys0nh1R0edHwI8xqGnVLpFZups8KoHrMWe6SnBqU9qnMdLIr6nmJt2Jn}
jwt.expiracion-ms=3600000
